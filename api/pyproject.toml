[project]
name = "vanaspati-sahayak-api"
version = "0.1.0"
description = "IP-SAKTI Sahayak API: cited IP and regulatory guidance for Ayurveda"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.6",
  "groq>=1.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "numpy>=1.26"]
# Local BGE-M3 embeddings and reranker (large download: torch + models).
local = ["sentence-transformers>=3.0"]
voyage = ["voyageai>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests quote real corpus lines verbatim.
"tests/*" = ["E501"]
# The rule table reads best one line per entry.
"app/classify/rules.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
