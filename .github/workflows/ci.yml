# Checks every push and pull request: the garden must still build and lint,
# and the API must pass ruff and pytest.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Every legal claim in the plant IP profiles is re-read from corpus/normalised/.
      - run: npm run check:ipr

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sahayak
          POSTGRES_PASSWORD: sahayak
          POSTGRES_DB: sahayak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahayak" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sahayak:sahayak@localhost:5432/sahayak
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest -q
      # Every locator a golden eval item expects must exist in the corpus.
      - run: uv run --no-sync python scripts/locators.py --check-golden
