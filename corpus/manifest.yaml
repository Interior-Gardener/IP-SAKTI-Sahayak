# Version-tracked legal corpus: the single source of truth for what Sahayak may cite.
#
# Rules (docs/CONTRIBUTING.md §4):
# - Official sources only. Every url was opened and checked when it was added.
# - `url` is the page a person should open; `fetch_url` is the file ingest downloads.
# - `fetch: manual` means the site blocks scripted download: save the file by hand
#   as corpus/raw/<id>.<format> and ingest picks it up.
# - sha256 and retrieved_at are recorded by ingest in the database, not here.
#   `effective_from` stays unset until someone checks the commencement date in the text.
# - `issued` is the date shown by the publishing site, not a commencement date.
# - Changing an entry = a line in CHANGELOG.md.
#
# Schema: api/app/ingest/manifest.py (validated by pytest).

version: 1
